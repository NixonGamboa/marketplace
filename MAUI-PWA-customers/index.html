<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MAUI — Tu Mercado Local</title>
  <meta name="theme-color" content="#5B3DF5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Anti-FOUC: aplica dark class antes de que React hidrate -->
    <script>
      (function(){try{var s=localStorage.getItem('maui-theme');var t=s?JSON.parse(s).state?.theme:null;if(t==='dark')document.documentElement.classList.add('dark')}catch(e){}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
