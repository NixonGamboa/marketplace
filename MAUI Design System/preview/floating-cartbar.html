<!doctype html><html><head><meta charset="utf-8"><title>Floating bar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { background:var(--maui-bg); padding:24px;}
.phone { width:280px; height:420px; background:#fff; border:1px solid var(--maui-border); border-radius:24px; position:relative; overflow:hidden; box-shadow:var(--maui-shadow-card);}
.phone .content { padding:16px; color:var(--maui-fg-muted); font-size:12px;}
.bar { position:absolute; left:0; right:0; bottom:0; height:60px; background:var(--maui-primary); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 18px; box-shadow:var(--maui-shadow-float); cursor:pointer;}
.bar:hover { background:var(--maui-primary-dark);}
.bar .left { display:flex; align-items:center; gap:10px; font-weight:600;}
.bar .count { position:relative;}
.bar .count .n { position:absolute; top:-6px; right:-6px; background:#fff; color:var(--maui-primary); font-size:10px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.bar .total { font-weight:700; font-variant-numeric:tabular-nums; font-size:16px; }
svg { width:22px; height:22px;}
</style></head><body>
<div class="phone">
  <div class="content">… catálogo de productos …</div>
  <div class="bar">
    <div class="left">
      <span class="count">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="n">2</span>
      </span>
      <span>Ver canasta</span>
    </div>
    <div class="total">$30.000</div>
  </div>
</div>
<div class="col" style="margin-left:24px; display:inline-flex;">
  <span class="mono">aparece al sumar 1 item · slide-in-bottom 300ms</span>
  <span class="mono">se oculta si canasta = 0</span>
</div>
</body></html>
