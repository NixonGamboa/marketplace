<!doctype html><html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head><body>
<div class="row">
  <div class="col"><div class="swatch dark" style="background:var(--maui-warning)"><span class="name">warning</span><span class="hex">#E65100</span></div><div class="mono">peso variable · ajuste</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-warning-bg);border:1px solid #F0D9B8"><span class="name">warning-bg</span><span class="hex">#FFF3E0</span></div></div>
  <div class="col"><div class="swatch dark" style="background:var(--maui-error)"><span class="name">error</span><span class="hex">#B71C1C</span></div><div class="mono">tienda cerrada</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-error-bg);border:1px solid #F5C9C9"><span class="name">error-bg</span><span class="hex">#FDECEC</span></div></div>
  <div class="col"><div class="swatch dark" style="background:var(--maui-whatsapp)"><span class="name">whatsapp</span><span class="hex">#25D366</span></div><div class="mono">magic link · soporte</div></div>
  <div class="col"><div class="swatch dark" style="background:var(--maui-whatsapp-dark)"><span class="name">whatsapp-dark</span><span class="hex">#1DA851</span></div></div>
</div>
<div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
  <span style="background:var(--maui-warning-bg); color:var(--maui-warning); font-size:12px; font-weight:500; padding:3px 10px; border-radius:9999px;">Peso variable</span>
  <span style="background:var(--maui-primary-50); color:var(--maui-primary); font-size:12px; font-weight:600; padding:3px 10px; border-radius:9999px; display:inline-flex; align-items:center; gap:6px;"><span style="width:6px;height:6px;border-radius:999px;background:var(--maui-primary);"></span>Abierto · 8:00 AM – 6:00 PM</span>
  <span style="background:var(--maui-error-bg); color:var(--maui-error); font-size:12px; font-weight:600; padding:3px 10px; border-radius:9999px;">Cerrado ahora</span>
</div>
</body></html>
