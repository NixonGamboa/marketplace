<!doctype html><html><head><meta charset="utf-8"><title>Wordmark</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--maui-bg); display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
  .wm-xl { font-family: var(--maui-font-display); font-weight:900; font-size:72px; letter-spacing:-.02em; color:#111; line-height:1; }
  .wm-md { font-family: var(--maui-font-display); font-weight:900; font-size:36px; letter-spacing:-.02em; color:#111; line-height:1; }
  .wm-lock { display:inline-flex; align-items:center; padding:12px 14px; background:#fff; border:1px solid var(--maui-border); border-radius:14px; }
  .wm-lock img { height:56px; display:block; }
  .partner { font-family: var(--maui-font-sans); font-weight:500; font-size:22px; color:var(--maui-fg-muted); display:inline-flex; align-items:center; gap:14px;}
  .partner .sep { width:1px; height:26px; background:var(--maui-border); }
  .partner img { height:40px; display:block; }
</style></head><body>
<div class="col">
  <div class="wm-xl">MAUI</div>
  <span class="mono">display · Archivo Black 900 · -2% tracking</span>
</div>
<div class="col">
  <div class="wm-lock"><img src="../assets/logo/maui-mark-green.svg" alt="MAUI"></div>
  <span class="mono">logo-lock (mark verde oficial)</span>
</div>
<div class="col">
  <div class="partner"><span class="wm-md">MAUI</span><span class="sep"></span><span>Leche y Miel</span></div>
  <span class="mono">co-brand header de catálogo</span>
</div>
</body></html>
