<!doctype html><html><head><meta charset="utf-8"><title>Primary & brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head><body>
<div class="row">
  <div class="col">
    <div class="swatch dark" style="background:var(--maui-primary)"><span class="name">primary</span><span class="hex">#2F7D32</span></div>
    <div class="mono">CTAs · precios · éxito</div>
  </div>
  <div class="col">
    <div class="swatch dark" style="background:var(--maui-primary-dark)"><span class="name">primary-dark</span><span class="hex">#1B5E20</span></div>
    <div class="mono">hover / press</div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--maui-primary-light)"><span class="name">primary-light</span><span class="hex">#81C784</span></div>
    <div class="mono">hover bg suaves</div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--maui-primary-50)"><span class="name">primary-50</span><span class="hex">#E8F5E9</span></div>
    <div class="mono">banner "Abierto"</div>
  </div>
  <div class="col">
    <div class="swatch dark" style="background:linear-gradient(135deg,#FFD54A,#FFB020,#F07B15)"><span class="name">sun (logo)</span><span class="hex">solo branding</span></div>
    <div class="mono">🚫 no usar en UI</div>
  </div>
</div>
</body></html>
