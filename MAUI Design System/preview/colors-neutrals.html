<!doctype html><html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head><body>
<div class="row">
  <div class="col"><div class="swatch" style="background:var(--maui-bg)"><span class="name">bg</span><span class="hex">#F8F4EE</span></div><div class="mono">fondo página</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-bg-warm)"><span class="name">bg-warm</span><span class="hex">#FDE8C6</span></div><div class="mono">landing amanecer</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-surface);border:1px solid var(--maui-border)"><span class="name">surface</span><span class="hex">#FFFFFF</span></div><div class="mono">cards, inputs</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-surface-alt)"><span class="name">surface-alt</span><span class="hex">#F9F7F4</span></div><div class="mono">zonas sec.</div></div>
  <div class="col"><div class="swatch" style="background:var(--maui-border)"><span class="name">border</span><span class="hex">#D6CFC4</span></div><div class="mono">1px divisores</div></div>
  <div class="col"><div class="swatch dark" style="background:var(--maui-fg)"><span class="name">fg</span><span class="hex">#1A1A1A</span></div><div class="mono">14.7:1</div></div>
  <div class="col"><div class="swatch dark" style="background:var(--maui-fg-muted)"><span class="name">fg-muted</span><span class="hex">#5C5C5C</span></div><div class="mono">7.1:1</div></div>
</div>
</body></html>
