<!doctype html><html><head><meta charset="utf-8"><title>Substitution</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { background:var(--maui-bg); flex-direction:column; gap:10px; align-items:flex-start;}
.h { font-weight:600; font-size:14px;}
.sub  { font-size:12px; color:var(--maui-fg-muted);}
.opts { display:flex; gap:10px;}
.opt  { width:120px; padding:12px 10px; background:#fff; border:1.5px solid var(--maui-border); border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--maui-fg); cursor:pointer; text-align:center; transition:all var(--maui-dur-fast);}
.opt:hover { border-color:var(--maui-primary-light);}
.opt.selected { border-color:var(--maui-primary); background:var(--maui-primary-50); box-shadow:0 0 0 3px rgba(47,125,50,.12);}
.opt svg { width:26px; height:26px; color:var(--maui-primary);}
</style></head><body>
<div class="h">¿Qué hacer si falta algo?</div>
<div class="sub">Seleccione uno · obligatorio para avanzar</div>
<div class="opts">
  <div class="opt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    <span>Llamarme por teléfono</span>
  </div>
  <div class="opt selected">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    <span>Cambiar por similar</span>
  </div>
  <div class="opt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    <span>No enviar y descontar</span>
  </div>
</div>
<span class="mono">bloquea el CTA "Pedir mi Mercado" hasta que haya selección</span>
</body></html>
