<!doctype html><html><head><meta charset="utf-8"><title>Product card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { background: var(--maui-bg); display:flex; gap:14px; align-items:flex-start; padding:20px;}
.pc {
  width:160px;

  background:#fff;
  border:1px solid var(--maui-border);
  border-radius:12px;
  box-shadow:var(--maui-shadow-card);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
}
.pc .ph { position:relative; aspect-ratio:1/1; background:var(--maui-gray-50); display:flex; align-items:center; justify-content:center; color:var(--maui-gray-400); font-size:11px; flex-shrink:0; }
.pc .body { padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; }
.pc .name { font-size:13px; font-weight:500; color:var(--maui-fg); line-height:1.3; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pc .price-row { margin-top:2px; }
.pc .price { font-size:15px; font-weight:600; color:var(--maui-primary); font-variant-numeric: tabular-nums;}
.pc .unit  { font-size:11px; color:var(--maui-fg-muted); }
.pc .cta   { height:36px; border:none; border-radius:8px; background:var(--maui-primary); color:#fff; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; margin-top:8px; }
.pc .cta.disabled { background:var(--maui-gray-100); color:var(--maui-fg-subtle); cursor:not-allowed; }
.pc .badge { position:absolute; top:6px; left:6px; background:var(--maui-primary); color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px; letter-spacing:.04em; z-index:1;}
.pc .variable {
  position:absolute; right:8px; bottom:8px;
  background:var(--maui-warning-bg); color:var(--maui-warning);
  font-size:10.5px; font-weight:600;
  padding:3px 8px; border-radius:9999px;
  box-shadow:0 1px 3px rgba(26,26,26,.08);
  z-index:1;
}
.pc .agotado  { position:absolute; top:6px; right:6px; background:var(--maui-error); color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px; z-index:1;}
.pc.out { opacity:.7; }
</style></head><body>
<div class="pc">
  <div class="ph">imagen</div>
  <div class="body">
    <div class="name">Leche Entera 1L</div>
    <div class="price-row"><span class="price">$3.200</span> <span class="unit">/ 1 L</span></div>
    <button class="cta">+ Agregar</button>
  </div>
</div>
<div class="pc">
  <span class="badge">Local</span>
  <div class="ph">
    imagen
    <span class="variable">Peso variable</span>
  </div>
  <div class="body">
    <div class="name">Queso Campesino</div>
    <div class="price-row"><span class="price">$8.500</span> <span class="unit">~500 g</span></div>
    <button class="cta">+ Agregar</button>
  </div>
</div>
<div class="pc out">
  <span class="agotado">Agotado</span>
  <div class="ph">imagen</div>
  <div class="body">
    <div class="name">Pan Tajado Integral</div>
    <div class="price-row"><span class="price">$5.200</span> <span class="unit">500 g</span></div>
    <button class="cta disabled" disabled>Sin stock</button>
  </div>
</div>
</body></html>
