<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { background: var(--maui-bg); gap:28px; display:flex; align-items:center; }
.card { width:160px; height:100px; background:#fff; border:1px solid var(--maui-border); border-radius:12px; display:flex; align-items:flex-end; padding:10px; }
</style></head><body>
<div class="col"><div class="card" style="box-shadow:var(--maui-shadow-card);"><span class="mono">card</span></div><span class="mono">default card</span></div>
<div class="col"><div class="card" style="box-shadow:var(--maui-shadow-sm);"><span class="mono">brand-sm</span></div><span class="mono">hover verde</span></div>
<div class="col"><div class="card" style="box-shadow:var(--maui-shadow-md);"><span class="mono">brand-md</span></div><span class="mono">CTA flotante</span></div>
<div class="col"><div class="card" style="box-shadow:var(--maui-shadow-float);"><span class="mono">float ↑</span></div><span class="mono">bottom bar</span></div>
</body></html>
