name: Publicar evidencia Preview

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Reporte JSON nuevo, revisado y sin credenciales (formato en .github/evidencia.md)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publicar:
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener publicador
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Validar y preparar reporte nuevo
        id: preparar
        env:
          PREVIEW_EVIDENCE_JSON: ${{ inputs.report }}
          MAUI_EVIDENCE_DIR: ${{ runner.temp }}/maui-preview-evidence
        run: node scripts/preview-evidence.mjs
      - name: Publicar evidencia por caso
        id: publicar
        if: always() && steps.preparar.outputs.report-ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidencia-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maui-preview-evidence/report.md
          if-no-files-found: error
          retention-days: 90
      - name: Mostrar enlace para la PR
        if: always() && steps.publicar.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.publicar.outputs.artifact-url }}
        run: |
          printf '\n[Descargar reporte final CI + Preview, máximo 200 líneas](%s) · Retención: 90 días.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
